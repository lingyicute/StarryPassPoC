name: test

on:
  # main 分支由 Pages 工作流调用本工作流；验证通过后才允许部署。
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  crypto-and-estimator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Known-answer vectors
        run: node tests/verify_spv2.js
      - name: Parameter, cache and cleanup regressions
        run: node tests/verify_core.js
      - name: Baseline compatibility and WASM / pure-JS parity
        run: node tests/verify_parity.js
      - name: Inline strength estimator regressions
        run: node tests/verify_strength.mjs
      - name: Service-worker cache lifetime regressions
        run: node tests/verify_sw.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test-only browser dependencies
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Browser and HTTPS offline regressions
        run: python tests/verify_browser.py
